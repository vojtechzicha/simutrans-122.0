<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simutrans save viewer</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9;
  --panel: #ffffff;
  --panel-2: #fbfbfc;
  --text: #1d2126;
  --text-dim: #636b75;
  --text-faint: #8b939d;
  --border: #dfe3e8;
  --border-strong: #c7ccd3;
  --accent: #2f6fb5;
  --accent-bg: rgba(47, 111, 181, 0.10);
  --row-hover: #eef2f7;
  --pos: #1f7a4d;
  --neg: #b1382f;
  --warn: #9a6b16;
  --t-road: #a87424;
  --t-rail: #35699c;
  --t-tram: #3f8a63;
  --t-monorail: #7256a3;
  --t-maglev: #a2558a;
  --t-narrowgauge: #8d5f3d;
  --t-ship: #2e8496;
  --t-air: #a04f4f;
  --t-truck: #7d7d3f;
  --t-bus: #a87424;
  --t-other: #6f7680;
  --badge-alpha: 0.13;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15181c;
    --panel: #1c2025;
    --panel-2: #202429;
    --text: #dfe3e8;
    --text-dim: #99a2ad;
    --text-faint: #727b86;
    --border: #2c3138;
    --border-strong: #3b424b;
    --accent: #6aa8e8;
    --accent-bg: rgba(106, 168, 232, 0.14);
    --row-hover: #23282e;
    --pos: #5cbd8a;
    --neg: #e2756a;
    --warn: #d3a54e;
    --t-road: #d3a55c;
    --t-rail: #6fa6dd;
    --t-tram: #6fbf94;
    --t-monorail: #a68ada;
    --t-maglev: #d18ab8;
    --t-narrowgauge: #bf9270;
    --t-ship: #5ec0d1;
    --t-air: #d68585;
    --t-truck: #b6b66a;
    --t-bus: #d3a55c;
    --t-other: #98a0aa;
    --badge-alpha: 0.18;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select { font: inherit; color: inherit; }

#app { display: flex; flex-direction: column; height: 100%; }

/* top bar */
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 0 14px; height: 42px; flex: 0 0 42px;
  background: var(--panel); border-bottom: 1px solid var(--border);
}
.topbar .brand { font-weight: 600; letter-spacing: 0.2px; }
.topbar .sep { color: var(--text-faint); }
.topbar .meta { color: var(--text-dim); display: flex; gap: 14px; flex-wrap: wrap; min-width: 0; }
.topbar .meta b { font-weight: 600; color: var(--text); }
.topbar .spacer { flex: 1 1 auto; }
.btn {
  background: var(--panel-2); border: 1px solid var(--border-strong); color: var(--text);
  border-radius: 4px; padding: 3px 9px; cursor: pointer;
}
.btn:hover { background: var(--row-hover); }

/* body */
.body { display: flex; flex: 1 1 auto; min-height: 0; }
.sidebar {
  flex: 0 0 172px; background: var(--panel); border-right: 1px solid var(--border);
  padding: 8px 0; overflow-y: auto;
}
.sidebar .group { padding: 10px 14px 4px; color: var(--text-faint); font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; }
.sidebar a.nav {
  display: flex; justify-content: space-between; align-items: center; gap: 6px;
  padding: 5px 14px; color: var(--text); border-left: 2px solid transparent;
}
.sidebar a.nav:hover { background: var(--row-hover); text-decoration: none; }
.sidebar a.nav.active { background: var(--accent-bg); border-left-color: var(--accent); color: var(--accent); font-weight: 600; }
.sidebar a.nav .count { color: var(--text-faint); font-variant-numeric: tabular-nums; font-weight: 400; }

.main { flex: 1 1 auto; min-width: 0; overflow: auto; padding: 14px; }
.main.nopad { padding: 0; }

h1 { font-size: 16px; margin: 0 0 10px; font-weight: 600; }
h2 { font-size: 13px; margin: 18px 0 7px; font-weight: 600; color: var(--text); }
h2:first-child { margin-top: 0; }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 5px; padding: 10px 12px; }
.cards { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--border); border-radius: 5px; padding: 8px 12px; min-width: 104px; }
.stat .n { font-size: 19px; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
.stat .l .badge { text-transform: none; letter-spacing: 0; }

.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; }
.kv dt { color: var(--text-dim); }
.kv dd { margin: 0; }

/* toolbar */
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.toolbar input[type=text], .toolbar select {
  background: var(--panel); border: 1px solid var(--border-strong); border-radius: 4px;
  padding: 3px 7px; min-width: 0;
}
.toolbar input[type=text] { width: 230px; }
.toolbar select { max-width: 320px; }
.toolbar input[type=text]:focus, .toolbar select:focus { outline: 2px solid var(--accent-bg); border-color: var(--accent); }
.toolbar .count { color: var(--text-dim); margin-left: auto; font-variant-numeric: tabular-nums; }

/* tables */
.twrap { border: 1px solid var(--border); border-radius: 5px; background: var(--panel); overflow: auto; max-height: calc(100vh - 150px); }
.twrap.short { max-height: 340px; }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; }
table.grid th, table.grid td { padding: 4px 8px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); }
table.grid th {
  position: sticky; top: 0; z-index: 2; background: var(--panel-2);
  font-weight: 600; color: var(--text-dim); border-bottom: 1px solid var(--border-strong);
  cursor: pointer; user-select: none;
}
table.grid th.nosort { cursor: default; }
table.grid th .arrow { color: var(--accent); margin-left: 3px; }
table.grid tbody tr:hover { background: var(--row-hover); }
table.grid tbody tr.clickable { cursor: pointer; }
table.grid td.num, table.grid th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.grid td.wide { white-space: normal; max-width: 420px; }
/* long names (stops carry line lists in this pakset) get cut with an ellipsis; the full text is in the title */
table.grid td.clip { max-width: 440px; overflow: hidden; text-overflow: ellipsis; }
.cols table.grid td.clip { max-width: 280px; }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.dim { color: var(--text-dim); }
.faint { color: var(--text-faint); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }

.badge {
  display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; line-height: 17px;
  border: 1px solid transparent; white-space: nowrap;
}
.badge + .badge { margin-left: 3px; }
.state { color: var(--text-dim); background: rgba(128,128,128,0.13); }
.state.ok { color: var(--pos); background: rgba(60,150,100,0.13); }
.state.bad { color: var(--neg); background: rgba(180,70,60,0.13); }
.state.warn { color: var(--warn); background: rgba(170,130,40,0.15); }

.bar { display: inline-block; width: 54px; height: 9px; background: var(--border); border-radius: 2px; overflow: hidden; vertical-align: -1px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar.over > i { background: var(--warn); }
.warnc { color: var(--warn); }
.badge.stype { color: var(--accent); background: var(--accent-bg); font-weight: 600; padding: 0 4px; }
.note { color: var(--text-dim); }
.pair { border-left: 3px solid var(--accent); }
.pairhead { font-weight: 600; margin-bottom: 6px; }
.kv dt.sep, .kv dd.sep { border-top: 1px solid var(--border); padding-top: 4px; margin-top: 3px; }
.bad { color: var(--neg); }
ol.sched li.shared { box-shadow: inset 4px 0 var(--accent); padding-left: 8px; }
ol.sched .cpl { color: var(--accent); font-size: 12px; }
ol.sched .cpl.end { color: var(--warn); }
ol.sched .cpl.bad { color: var(--neg); }
.legendbar { display: inline-block; width: 4px; height: 12px; background: var(--accent); vertical-align: -1px; margin-right: 3px; }

.backlink { display: inline-block; margin-bottom: 8px; }
.detail-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.detail-head h1 { margin: 0; }
.cols { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
.cols > * { flex: 1 1 340px; min-width: 300px; }
.empty { color: var(--text-dim); padding: 8px 2px; }

ol.sched { margin: 0; padding-left: 26px; }
ol.sched li { padding: 2px 0; border-bottom: 1px solid var(--border); }
ol.sched li:last-child { border-bottom: 0; }
ol.sched li.here { background: var(--accent-bg); }
ol.sched .wp { color: var(--text-faint); font-style: italic; }
ol.sched .opts { color: var(--text-dim); }

/* loader */
.loader { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 50; }
.drop {
  border: 2px dashed var(--border-strong); border-radius: 8px; background: var(--panel);
  padding: 34px 44px; text-align: center; max-width: 520px;
}
.drop.over { border-color: var(--accent); background: var(--accent-bg); }
.drop h1 { font-size: 17px; margin-bottom: 6px; }
.drop p { color: var(--text-dim); margin: 6px 0 14px; }
.drop .err { color: var(--neg); margin-top: 10px; min-height: 18px; }
.dropmask {
  position: fixed; inset: 0; z-index: 60; background: var(--accent-bg);
  border: 3px dashed var(--accent); display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: var(--accent); pointer-events: none;
}

/* map */
.maproot { display: flex; flex-direction: column; height: 100%; }
.mapbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 7px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
.mapbar label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.mapbar .hint { color: var(--text-faint); margin-left: auto; }
.mapholder { position: relative; flex: 1 1 auto; min-height: 0; }
#mapcanvas { display: block; width: 100%; height: 100%; cursor: grab; }
#mapcanvas.drag { cursor: grabbing; }
.maptip {
  position: absolute; pointer-events: none; background: var(--panel); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: 4px; padding: 2px 7px;
  font-size: 12px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.18); z-index: 3;
}
.swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: -1px; margin-right: 2px; }
</style>
</head>
<body>

<div id="app" hidden>
  <div class="topbar">
    <span class="brand">Simutrans save viewer</span>
    <span class="meta" id="topmeta"></span>
    <span class="spacer"></span>
    <button class="btn" id="btn-open">Open another file</button>
  </div>
  <div class="body">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="main" id="main"></div>
  </div>
</div>

<div class="loader" id="loader">
  <div class="drop" id="drop">
    <h1>Simutrans save viewer</h1>
    <p>No file loaded. Drop an export JSON here or choose a file.</p>
    <button class="btn" id="btn-pick">Choose file</button>
    <p class="faint" style="margin-top:14px">Make one with: simutrans -load CZR -export czr.json</p>
    <div class="err" id="loaderr"></div>
  </div>
</div>

<input type="file" id="fileinput" accept=".json,application/json" hidden>

<script>
"use strict";

/* ---------------------------------------------------------------- helpers */

var MONTH_NAMES = ["January","February","March","April","May","June",
                   "July","August","September","October","November","December"];
var TYPES = ["road","rail","tram","monorail","maglev","narrowgauge","ship","air","truck","bus","other"];
var LINE_TYPES = ["road","rail","tram","monorail","maglev","narrowgauge","ship","air","other"];

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function num(v, d) { return (typeof v === "number" && isFinite(v)) ? v : (d === undefined ? 0 : d); }
function arr(v) { return Array.isArray(v) ? v : []; }
function obj(v) { return (v && typeof v === "object" && !Array.isArray(v)) ? v : {}; }
function str(v, d) { return (typeof v === "string" && v.length) ? v : (d === undefined ? "" : d); }

function fmtInt(n) {
  n = num(n);
  var neg = n < 0;
  var s = Math.abs(Math.round(n)).toString();
  var out = "";
  while (s.length > 3) { out = " " + s.slice(-3) + out; s = s.slice(0, -3); }
  return (neg ? "-" : "") + s + out;
}
function fmtMoney(n) {
  n = num(n);
  var neg = n < 0;
  var a = Math.abs(n).toFixed(2).split(".");
  var s = a[0], out = "";
  while (s.length > 3) { out = " " + s.slice(-3) + out; s = s.slice(0, -3); }
  return (neg ? "-" : "") + s + out + "." + a[1];
}
function signed(n, money) {
  var t = money ? fmtMoney(n) : fmtInt(n);
  var c = num(n) > 0 ? "pos" : (num(n) < 0 ? "neg" : "dim");
  return '<span class="' + c + '">' + t + "</span>";
}
function fmtPos(p) {
  if (!p || typeof p.x !== "number") return '<span class="faint">-</span>';
  var t = p.x + ", " + p.y + (typeof p.z === "number" ? ", " + p.z : "");
  return '<span class="mono">(' + t + ")</span>";
}
function posText(p) {
  if (!p || typeof p.x !== "number") return "-";
  return "(" + p.x + ", " + p.y + (typeof p.z === "number" ? ", " + p.z : "") + ")";
}
function titleOf(s) { return str(s).replace(/_/g, " "); }
function typeBadge(t) {
  t = str(t, "other");
  var known = TYPES.indexOf(t) >= 0 ? t : "other";
  return '<span class="badge" style="color:var(--t-' + known + ');background:color-mix(in srgb, var(--t-' +
         known + ') calc(var(--badge-alpha) * 100%), transparent)">' + esc(titleOf(t)) + "</span>";
}
var TRACTION_TEXT = { under_wire_electric: "under wires, electric only", under_wire_all: "under wires, all engines",
  off_wire: "off wires" };
var BAD_STATES = { loss: 1, no_convoys: 1, nothing_moved: 1, missing_scheduled_slots: 1 };
var WARN_STATES = { overcrowded: 1, obsolete: 1, no_route: 1, self_destruct: 1, uncoupling: 1 };
function stateBadge(s) {
  s = str(s, "unknown");
  var cls = s === "ok" || s === "driving" || s === "loading" || s === "coupled" ? "ok"
          : BAD_STATES[s] ? "bad" : WARN_STATES[s] ? "warn" : "";
  return '<span class="badge state ' + cls + '">' + esc(titleOf(s)) + "</span>";
}
/* passenger vehicles load standing and overcrowded passengers past their seats, so a level can pass 100% */
function loadBar(pct) {
  pct = Math.max(0, Math.round(num(pct)));
  var w = Math.min(100, pct);
  return '<span class="bar' + (pct > 100 ? " over" : "") + '" title="' + pct + '%"><i style="width:' + w + '%"></i></span> ' +
         '<span class="' + (pct > 100 ? "warnc" : "dim") + '">' + pct + "%</span>";
}
/* fork stop types (schedule_entry_t::stop_type_t), shown as the lettered badge of the schedule dialog */
var STOP_TYPES = [null, { l: "T", t: "Terminal: everything off, then load" }, { l: "A", t: "All off: everything off, no loading" },
  { l: "L", t: "Only load: no unloading" }, { l: "U", t: "Only unload: no loading" },
  { l: "H", t: "Hold: no loading or unloading, only to let trains pass" }];
function stopTypeBadge(t) {
  var s = STOP_TYPES[num(t)];
  return s ? '<span class="badge stype" title="' + esc(s.t) + '">' + s.l + "</span> " : "";
}
function pad2(n) { return (n < 10 ? "0" : "") + n; }
/* world calendar (fork): the clock and date the status bar shows, next to the game year */
function calendarText(d) {
  var c = obj(obj(d).calendar);
  if (!c.year) return "";
  return pad2(num(c.hour)) + ":" + pad2(num(c.minute)) + ", " + num(c.day) + " " +
         MONTH_NAMES[Math.max(0, Math.min(11, num(c.month, 1) - 1))] + " " + c.year;
}
function crowdText(cr) {
  cr = obj(cr);
  if (!num(cr.seats)) return "";
  return "seats " + fmtInt(cr.seated) + "/" + fmtInt(cr.seats) +
         ", standing " + fmtInt(cr.standing) + "/" + fmtInt(cr.standing_places) +
         ", overcrowded " + fmtInt(cr.overcrowded) + "/" + fmtInt(cr.overcrowded_places);
}
function monthLabel(i) {
  var d = obj(D && D.meta && D.meta.date);
  var y = num(d.year, 0), m = num(d.month, 1) - 1 - i;
  while (m < 0) { m += 12; y -= 1; }
  if (!y) return i === 0 ? "This month" : (i === 1 ? "1 month back" : i + " months back");
  return MONTH_NAMES[((m % 12) + 12) % 12] + " " + y;
}

/* ------------------------------------------------------------------ state */

var D = null;          // raw export
var IDX = null;        // lookup maps
var route = { view: "overview", id: null };
var filters = {};      // per view filter state

function buildIndex() {
  var i = {
    line: {}, stop: {}, convoy: {}, player: {}, goods: {},
    lineTypes: {}, stopTypes: {}
  };
  arr(D.lines).forEach(function (l) { i.line[l.id] = l; i.lineTypes[str(l.type, "other")] = 1; });
  arr(D.stops).forEach(function (s) {
    i.stop[s.id] = s;
    arr(s.station_types).forEach(function (t) { i.stopTypes[t] = 1; });
  });
  arr(D.convoys).forEach(function (c) { i.convoy[c.id] = c; });
  arr(D.players).forEach(function (p) { i.player[p.id] = p; });
  arr(D.goods).forEach(function (g) { i.goods[g.index] = g; });
  IDX = i;
  IDX.couplings = computeCouplings();
}
function playerName(id) {
  if (id === null || id === undefined) return "-";
  var p = IDX.player[id];
  return p ? str(p.name, "Player " + id) : "Player " + id;
}
function lineLink(id) {
  var l = IDX.line[id];
  if (!l) return '<span class="faint">-</span>';
  return '<a href="#line/' + id + '">' + esc(str(l.name, "Line " + id)) + "</a>";
}
function stopLink(id) {
  var s = IDX.stop[id];
  if (!s) return '<span class="faint">-</span>';
  return '<a href="#stop/' + id + '">' + esc(str(s.name, "Stop " + id)) + "</a>";
}
function convoyLink(id) {
  var c = IDX.convoy[id];
  if (!c) return '<span class="faint">-</span>';
  return '<a href="#convoy/' + id + '">' + esc(str(c.name, "Convoy " + id)) + "</a>";
}
function goodsName(index) {
  var g = IDX.goods[index];
  return g ? str(g.label, str(g.name, "Goods " + index)) : "Goods " + index;
}
function catgName(index) {
  var found = null;
  arr(D.goods).forEach(function (g) { if (found === null && num(g.catg_index, -1) === index) found = g; });
  return found ? str(found.catg_label, str(found.catg_name, str(found.name, "Category " + index))) : "Category " + index;
}

/* ---------------------------------------------------------------- loading */

function loadJSON(text, sourceName) {
  var data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    throw new Error("Could not parse this file as JSON.");
  }
  if (!data || typeof data !== "object" || Array.isArray(data)) {
    throw new Error("This file does not contain a Simutrans export object.");
  }
  if (!data.meta && !data.lines && !data.stops && !data.convoys) {
    throw new Error("This JSON has none of the expected sections (meta, lines, stops, convoys).");
  }
  D = data;
  if (!D.meta) D.meta = {};
  if (sourceName && !str(D.meta.save_file)) D.meta.save_file = sourceName;
  buildIndex();
  filters = {};
  document.getElementById("loader").hidden = true;
  document.getElementById("app").hidden = false;
  renderTop();
  renderSidebar();
  if (!location.hash) {
    var last = "overview";
    try { last = localStorage.getItem("simutrans-saveviewer-tab") || "overview"; } catch (e) {}
    location.hash = "#" + last;
  }
  onHash();
}

function handleFile(file) {
  var r = new FileReader();
  r.onload = function () {
    try { loadJSON(String(r.result), file.name); }
    catch (e) { showLoadError(e.message); }
  };
  r.onerror = function () { showLoadError("Could not read the file."); };
  r.readAsText(file);
}
function showLoadError(msg) {
  document.getElementById("loader").hidden = false;
  document.getElementById("app").hidden = true;
  document.getElementById("loaderr").textContent = msg;
}

/* -------------------------------------------------------------- top + nav */

function renderTop() {
  var m = obj(D.meta), d = obj(m.date), mp = obj(m.map);
  var bits = [];
  bits.push("<b>" + esc(str(m.save_file, "unnamed save")) + "</b>");
  if (d.year) bits.push(MONTH_NAMES[Math.max(0, Math.min(11, num(d.month, 1) - 1))] + " " + d.year);
  if (calendarText(d)) bits.push(esc(calendarText(d)));
  if (str(m.pakset)) bits.push(esc(m.pakset));
  if (str(m.game_version)) bits.push("version " + esc(m.game_version));
  if (mp.width) bits.push(mp.width + " x " + mp.height);
  document.getElementById("topmeta").innerHTML = bits.join('<span class="sep"> / </span>');
}

var NAV = [
  { id: "overview", label: "Overview" },

/* ----------------------------------------------------------- table engine */

/* cols: [{ key, label, num, sortable, value(row), html(row) }] */
function renderTable(host, cols, rows, opt) {
  opt = opt || {};
  var state = opt.state || (opt.state = { sort: null, dir: 1 });
  var wrap = document.createElement("div");
  wrap.className = "twrap" + (opt.short ? " short" : "");
  var table = document.createElement("table");
  table.className = "grid";
  var thead = document.createElement("thead");
  var tbody = document.createElement("tbody");
  table.appendChild(thead); table.appendChild(tbody);
  wrap.appendChild(table); host.appendChild(wrap);

  var sorted = rows.slice();
  if (state.sort) {
    var col = null;
    cols.forEach(function (c) { if (c.key === state.sort) col = c; });
    if (col) {
      var dir = state.dir;
      sorted.sort(function (a, b) {
        var va = col.value ? col.value(a) : "", vb = col.value ? col.value(b) : "";
        if (typeof va === "number" && typeof vb === "number") return (va - vb) * dir;
        va = String(va === null || va === undefined ? "" : va);
        vb = String(vb === null || vb === undefined ? "" : vb);
        return va.localeCompare(vb, undefined, { numeric: true, sensitivity: "base" }) * dir;
      });
    }
  }

  var hh = "<tr>";
  cols.forEach(function (c) {
    var sortable = c.sortable !== false;
    var a = state.sort === c.key ? '<span class="arrow">' + (state.dir > 0 ? "▲" : "▼") + "</span>" : "";
    hh += '<th class="' + (c.num ? "num " : "") + (sortable ? "" : "nosort") + '" data-key="' +
          esc(c.key) + '" title="' + esc(c.title || c.label) + '">' + esc(c.label) + a + "</th>";
  });
  hh += "</tr>";
  thead.innerHTML = hh;
  if (opt.onSort !== false) {
    thead.addEventListener("click", function (ev) {
      var th = ev.target.closest ? ev.target.closest("th") : null;
      if (!th || th.classList.contains("nosort")) return;
      var k = th.getAttribute("data-key");
      if (state.sort === k) state.dir = -state.dir; else { state.sort = k; state.dir = 1; }
      if (opt.rerender) opt.rerender();
    });
  }

  /* chunked rendering keeps big exports responsive */
  var pos = 0, CHUNK = 150;
  function more() {
    if (pos >= sorted.length) return;
    var end = Math.min(sorted.length, pos + CHUNK), h = "";
    for (var i = pos; i < end; i++) {
      var row = sorted[i];
      var href = opt.href ? opt.href(row) : null;
      h += "<tr" + (href ? ' class="clickable" data-href="' + esc(href) + '"' : "") + ">";
      for (var j = 0; j < cols.length; j++) {
        var c = cols[j];
        var cls = c.num ? "num" : (c.wide ? "wide" : (c.clip ? "clip" : ""));
        var title = c.clip && c.value ? c.value(row) : "";
        h += "<td" + (cls ? ' class="' + cls + '"' : "") +
             (title ? ' title="' + esc(String(title)) + '"' : "") + ">" +
             (c.html ? c.html(row) : esc(c.value ? c.value(row) : "")) + "</td>";
      }
      h += "</tr>";
    }
    tbody.insertAdjacentHTML("beforeend", h);
    pos = end;
  }
  more();
  wrap.addEventListener("scroll", function () {
    if (wrap.scrollTop + wrap.clientHeight > wrap.scrollHeight - 220) more();
  });
  if (opt.href) {
    tbody.addEventListener("click", function (ev) {
      if (ev.target.tagName === "A") return;
      var tr = ev.target.closest ? ev.target.closest("tr") : null;
      if (tr && tr.getAttribute("data-href")) location.hash = tr.getAttribute("data-href");
    });
  }
  if (!sorted.length) {
    var e = document.createElement("div");
    e.className = "empty";
    e.textContent = opt.emptyText || "Nothing to show.";
    host.appendChild(e);
  }
  return wrap;
}

function monthTable(host, stats, cols) {
  var rows = [];
  var len = 0;
  cols.forEach(function (c) { len = Math.max(len, arr(stats[c.key]).length); });
  for (var i = 0; i < len; i++) rows.push(i);
  var tcols = [{ key: "month", label: "Month", sortable: false, html: function (i) { return esc(monthLabel(i)); } }];
  cols.forEach(function (c) {
    tcols.push({
      key: c.key, label: c.label, num: true, sortable: false,
      html: function (i) {
        var v = arr(stats[c.key])[i];
        if (v === null || v === undefined) return '<span class="faint">-</span>';
        return c.money ? (c.signed ? signed(v, true) : fmtMoney(v)) : (c.signed ? signed(v) : fmtInt(v));
      }
    });
  });
  if (!len) {
    var e = document.createElement("div");
    e.className = "empty";
    e.textContent = "No monthly statistics in this export.";
    host.appendChild(e);
    return;
  }
  renderTable(host, tcols, rows, { short: true, onSort: false });
}

function toolbar(host, parts) {
  var bar = document.createElement("div");
  bar.className = "toolbar";
  parts.forEach(function (p) { bar.appendChild(p); });
  host.appendChild(bar);
  return bar;
}
var pendingFocus = null;   /* keeps the caret in the filter box across a rerender */

function textFilter(value, placeholder, onChange, key) {
  var i = document.createElement("input");
  i.type = "text";
  i.placeholder = placeholder || "Filter";
  i.value = value || "";
  i.setAttribute("data-focus-key", key || "filter");
  var t = null;
  i.addEventListener("input", function () {
    clearTimeout(t);
    t = setTimeout(function () {
      pendingFocus = { key: i.getAttribute("data-focus-key"), pos: i.selectionStart };
      onChange(i.value);
    }, 120);
  });
  return i;
}
function restoreFocus() {
  if (!pendingFocus) return;
  var el = document.querySelector('[data-focus-key="' + pendingFocus.key + '"]');
  if (el) {
    el.focus();
    try { el.setSelectionRange(pendingFocus.pos, pendingFocus.pos); } catch (e) {}
  }
  pendingFocus = null;
}
function selectFilter(value, options, onChange) {
  var s = document.createElement("select");
  options.forEach(function (o) {
    var op = document.createElement("option");
    op.value = o.value; op.textContent = o.label;
    if (String(o.value) === String(value)) op.selected = true;
    s.appendChild(op);
  });
  s.addEventListener("change", function () { onChange(s.value); });
  return s;
}
function countLabel(shown, total, noun) {
  var s = document.createElement("span");
  s.className = "count";
  s.textContent = shown === total ? fmtInt(total) + " " + noun : fmtInt(shown) + " of " + fmtInt(total) + " " + noun;
  return s;
}
function heading(host, text) {
  var h = document.createElement("h2");
  h.textContent = text;
  host.appendChild(h);
  return h;
}
function html(host, markup) {
  var d = document.createElement("div");
  d.innerHTML = markup;
  host.appendChild(d);
  return d;
}
function matches(hay, needle) {
  if (!needle) return true;
  return hay.toLowerCase().indexOf(needle.toLowerCase()) >= 0;
}
function ownerOptions() {
  var o = [{ value: "", label: "All owners" }];
  arr(D.players).forEach(function (p) { o.push({ value: String(p.id), label: str(p.name, "Player " + p.id) }); });
  return o;
}

function scheduleList(host, sched, opt) {
  sched = obj(sched);
  var entries = arr(sched.entries);
  if (!entries.length) {
    html(host, '<div class="empty">This schedule has no entries.</div>');
    return;
  }
  var h = '<div class="card"><ol class="sched">';
  entries.forEach(function (e, i) {
    e = obj(e);
    var here = num(sched.current_stop, -1) === i;
    var mark = opt && opt.marks ? opt.marks[i] : null;
    h += '<li class="' + (here ? "here " : "") + (mark && mark.shared ? "shared" : "") + '">' + stopTypeBadge(e.stop_type);
    if (e.depot) {
      h += '<span class="wp">Depot</span> ' + fmtPos(e.pos);
    } else if (e.halt_id === null || e.halt_id === undefined) {
      h += '<span class="wp">Waypoint</span> ' + fmtPos(e.pos);
    } else {
      h += stopLink(e.halt_id) + " " + fmtPos(e.pos);
    }
    var opts = [];
    if (num(e.minimum_loading) > 0) opts.push("load at least " + num(e.minimum_loading) + "%");
    if (num(e.waiting_time_minutes) > 0) opts.push("wait " + num(e.waiting_time_minutes) + " min");
    else if (num(e.waiting_time) > 0) opts.push("wait 1/" + Math.pow(2, 16 - num(e.waiting_time)) + " month");
    if (num(e.departure_interval) > 0) {
      var offs = Array.isArray(e.departure_offsets) ? e.departure_offsets : [];
      if (offs.length > 1) opts.push("every " + num(e.departure_interval) + " min at " + offs.join(", "));
      else opts.push("every " + num(e.departure_interval) + " min" + (num(e.departure_offset) > 0 ? ", +" + num(e.departure_offset) : ""));
    }
    var stopTypes = ["", "terminal", "all off", "only load", "only unload", "hold"];
    if (stopTypes[num(e.stop_type)]) opts.push(stopTypes[num(e.stop_type)]);
    if (opts.length) h += ' <span class="opts">(' + esc(opts.join(", ")) + ")</span>";
    if (mark && mark.notes.length) {
      h += mark.notes.map(function (n) { return '<div class="cpl ' + n.cls + '">' + n.html + "</div>"; }).join("");
    } else if (!(opt && opt.marks) && e.couple_line_id !== null && e.couple_line_id !== undefined) {
      h += ' <span class="opts">(couples with ' + lineLink(e.couple_line_id) +
           ", waits up to " + num(e.couple_max_wait) + " min)</span>";
    }
    h += "</li>";
  });
  h += "</ol></div>";
  var flags = [];
  if (sched.bidirectional) flags.push("bidirectional");
  if (sched.mirrored) flags.push("mirrored");
  if (sched.no_standing) flags.push("no standing passengers");
  else if (sched.no_overcrowding) flags.push("no overcrowded passengers");
  if (flags.length) h += '<div class="dim" style="margin-top:4px">Schedule flags: ' + esc(flags.join(", ")) + "</div>";
  html(host, h);
}

/* ---- coupled running (fork) ----
   A schedule entry of line J with couple_line_id = P: a train of J joins a train of P there, behind it.
   Played forward like convoi_t::get_uncouple_halt(): they couple at an entry of P at the same stop that
   goes on to the same next stop, stay together while both schedules go on to the same next stop
   (waypoints skipped, a depot ends the run) and part at the first stop where the next stops differ. */
function isStop(e) { e = obj(e); return e.halt_id !== null && e.halt_id !== undefined; }
function nextStopIdx(entries, i) {
  for (var k = 1; k <= entries.length; k++) {
    var idx = (i + k) % entries.length, e = obj(entries[idx]);
    if (isStop(e)) return idx;
    if (e.depot) return -1;
  }
  return -1;
}
/* stop names in this pakset carry line lists: "Zábřeh na Moravě [M1,...] <001,...> / Zábřeh, žel.st." */
function shortStop(id) {
  var n = str(obj(IDX.stop[id]).name, "Stop " + id);
  var cut = n.search(/\s[\[(<]/);
  return cut > 0 ? n.slice(0, cut) : n;
}
function shortStopLink(id) {
  if (!IDX.stop[id]) return '<span class="faint">?</span>';
  return '<a href="#stop/' + id + '" title="' + esc(str(IDX.stop[id].name)) + '">' + esc(shortStop(id)) + "</a>";
}
function computeCouplings() {
  var list = [];
  arr(D.lines).forEach(function (J) {
    var je = arr(obj(J.schedule).entries);
    je.forEach(function (e, j) {
      if (!e || e.couple_line_id === null || e.couple_line_id === undefined) return;
      var P = IDX.line[e.couple_line_id] || null;
      var c = { primary: P, joined: J, jEntry: j, halt: e.halt_id, maxWait: num(e.couple_max_wait),
                pEntry: -1, shared: [], split: null, staysCoupled: false,
                jNextHalt: nextStopIdx(je, j) >= 0 ? je[nextStopIdx(je, j)].halt_id : null };

}
/* the coupling of list whose run passes the coupling point of c already coupled, or null */
function subsumedBy(c, list) {

    }

}
/* departure rule of a schedule entry in words */

    var offs = arr(e.departure_offsets).length ? arr(e.departure_offsets) : [num(e.departure_offset)];
    return "every " + num(e.departure_interval) + " min at +" + offs.join(", +");
  }

  var oi = num(obj(ours).departure_interval), ti = num(obj(theirs).departure_interval);
  if (oi > 0 && ti > 0 && a !== b) h += ' <span class="warnc">(different, the trains will not always meet)</span>';
  else if (oi > 0 && ti > 0) h += ' <span class="pos">(same slots)</span>';

}
function shortLineName(l) { return str(l.name, "Line " + l.id).split(" ")[0]; }
/* passed coupled by a run from another coupling point of the same two lines (and not the other way round) */
function isFallback(c, list) {

}
/* how many different stop entries of our schedule the coupled run covers */
function distinctOurs(c, key) {

  return n;
}
/* entry index -> { shared, notes: [{ cls, html }] } for the schedule of line l */
function couplingMarks(l, couplings) {
  var entries = arr(obj(l.schedule).entries), marks = {};
  function at(i) { return marks[i] || (marks[i] = { shared: false, notes: [] }); }
  couplings.forEach(function (c) {
    var weP = c.primary && c.primary.id === l.id;
    var key = weP ? "p" : "j";

        ", used only when the trains arrive here separately; a coupled pair runs through" });

    at(first).notes.push({ cls: "start", html: "&#9901; " + (weP ? otherTxt + " joins behind us here" : "we join " + otherTxt + " here, behind its train") +
      ", whichever train is first waits up to " + c.maxWait + " min" });

/* what the convoy window shows under the destination (fork): why it waits, or when it leaves */
function waitText(c, links) {

    case "station_entry": return "Waiting to enter the station";

  var d = c.departure;

/* short badges for tables: coupling, late, hold marker, waiting */

  var w = waitText(c, false);

  return b.join(" ");
}
function convoyNotesValue(c) {

         obj(c.waiting_for).reason + " " + (c.departure ? "departure" : "");
}

        : "our train runs behind the train of " + otherTxt + ", which drives the pair") + "</dd>";
    var seats = function (line) {

    "<dt>Position</dt><dd>" + fmtPos(s.pos) + "</dd>" +
    "<dt>Tiles</dt><dd>" + fmtInt(arr(s.tiles).length) + "</dd>" +
    "<dt>Handles</dt><dd>" + (enabled.length ? esc(enabled.join(", ")) : '<span class="faint">nothing</span>') + "</dd>" +
    "<dt>Capacity</dt><dd><span class='mono'>" + capText(s.capacity) + '</span> <span class="faint">(passengers / mail / goods)</span></dd>' +
    "<dt>Waiting now</dt><dd><span class='mono'>" + capText(s.waiting_total) + '</span> <span class="faint">(passengers / mail / goods)</span>' +
      (num(obj(s.waiting_total).missed) > 0 ? ', <span class="warnc">' + fmtInt(obj(s.waiting_total).missed) +
        " missed a full vehicle</span>" : "") + "</dd>" +
    "<dt>Passengers this month</dt><dd>" + fmtInt(pax.happy) + " happy, " + fmtInt(pax.unhappy) +
      " unhappy, " + fmtInt(pax.no_route) + " without a route</dd>" +
    "</dl></div>");

  var cols = document.createElement("div");
  cols.className = "cols";
  host.appendChild(cols);
  var left = document.createElement("div"), right = document.createElement("div");
  cols.appendChild(left); cols.appendChild(right);

  heading(left, "Waiting goods");
  renderTable(left, [
    { key: "g", label: "Goods", value: function (w) { return str(w.goods_name, goodsName(w.goods_index)); },
      html: function (w) { return esc(str(w.goods_name, goodsName(w.goods_index))); } },
    { key: "a", label: "Amount", num: true, value: function (w) { return num(w.amount); },
      html: function (w) { return fmtInt(w.amount); } },
    { key: "m", label: "Missed a full vehicle", num: true, title: "May board the next vehicle overcrowded",
      html: function (w) { return num(w.missed) ? fmtInt(w.missed) : '<span class="faint">-</span>'; } }
  ], arr(s.waiting), { short: true, onSort: false, emptyText: "Nothing is waiting here." });

  heading(left, "Lines serving this stop");
  var lines = arr(s.line_ids).map(function (id) { return IDX.line[id]; }).filter(Boolean);
  renderTable(left, [
    { key: "name", label: "Name", clip: true, value: function (l) { return str(l.name); },
      html: function (l) { return lineLink(l.id); } },
    { key: "type", label: "Type", html: function (l) { return typeBadge(l.type); } },
    { key: "state", label: "State", html: function (l) { return stateBadge(l.state); } },
    { key: "owner", label: "Owner", html: function (l) { return esc(playerName(l.owner_id)); } }
  ], lines, { short: true, onSort: false, href: function (l) { return "#line/" + l.id; },
              emptyText: "No line stops here." });

  heading(right, "Convoys");
  convoyMiniTable(right, s.convoy_ids);

  heading(right, "Connections");
  var conns = arr(s.connections);
  if (!conns.length) {
    html(right, '<div class="empty">No direct connections in this export.</div>');
  } else {
    var byHalt = {};
    conns.forEach(function (c) {
      var k = String(c.halt_id);
      if (!byHalt[k]) byHalt[k] = { halt_id: c.halt_id, catgs: [] };
      if (byHalt[k].catgs.indexOf(c.catg_index) < 0) byHalt[k].catgs.push(c.catg_index);
    });
    var list = Object.keys(byHalt).map(function (k) { return byHalt[k]; });
    renderTable(right, [
      { key: "halt", label: "Stop", clip: true, value: function (c) { return str((IDX.stop[c.halt_id] || {}).name); },
        html: function (c) { return stopLink(c.halt_id); } },
      { key: "catg", label: "Goods categories", sortable: false,
        html: function (c) {
          return esc(c.catgs.map(function (x) { return catgName(x); }).join(", "));
        } }
    ], list, { short: true, onSort: false });
  }

  heading(host, "Last 12 months");
  monthTable(host, obj(s.stats), [
    { key: "arrived", label: "Arrived" },
    { key: "departed", label: "Departed" },
    { key: "waiting", label: "Waiting" },
    { key: "happy", label: "Happy" },
    { key: "unhappy", label: "Unhappy" },
    { key: "no_route", label: "No route" },
    { key: "convoys_arrived", label: "Convoys arrived" }
  ]);
}

/* ---- convoys ---- */

function viewConvoys(host) {
  var f = filters.convoys || (filters.convoys = { q: "", owner: "", line: "", flag: "", state: { sort: null, dir: 1 } });
  html(host, "<h1>Convoys</h1>");
  var all = arr(D.convoys);
  var FLAGS = {
    coupled: function (c) { return !!c.coupling; },
    waiting: function (c) { return !!c.waiting_for; },
    departure: function (c) { return !!c.departure; },
    late: function (c) { return !!c.running_late; },
    hold: function (c) { return !!c.hold_marker || !!c.hold_divert; },
    crowded: function (c) { return num(obj(c.crowd).standing) + num(obj(c.crowd).overcrowded) > 0; }
  };
  var rows = all.filter(function (c) {
    if (f.flag && FLAGS[f.flag] && !FLAGS[f.flag](c)) return false;
    if (f.owner !== "" && String(num(c.owner_id, -1)) !== f.owner) return false;
    if (f.line === "none" && c.line_id !== null && c.line_id !== undefined) return false;
    if (f.line !== "" && f.line !== "none" && String(c.line_id) !== f.line) return false;
    var lname = (c.line_id !== null && c.line_id !== undefined && IDX.line[c.line_id])
              ? str(IDX.line[c.line_id].name) : "";
    return matches(str(c.name) + " " + str(c.state) + " " + lname + " " + playerName(c.owner_id), f.q);
  });
  var lineOpts = [{ value: "", label: "All lines" }, { value: "none", label: "Without a line" }];
  arr(D.lines).forEach(function (l) { lineOpts.push({ value: String(l.id), label: str(l.name, "Line " + l.id) }); });
  toolbar(host, [
    textFilter(f.q, "Filter by name, state, line", function (v) { f.q = v; rerender(); }),
    selectFilter(f.owner, ownerOptions(), function (v) { f.owner = v; rerender(); }),
    selectFilter(f.line, lineOpts, function (v) { f.line = v; rerender(); }),
    selectFilter(f.flag, [{ value: "", label: "All convoys" }, { value: "coupled", label: "Coupled" },
      { value: "waiting", label: "Waiting (signals, passing, coupling)" }, { value: "departure", label: "With a planned departure" },
      { value: "late", label: "Running late" }, { value: "hold", label: "Hold marker or diverted" },
      { value: "crowded", label: "Standing or overcrowded passengers" }], function (v) { f.flag = v; rerender(); }),
    countLabel(rows.length, all.length, "convoys")
  ]);
  renderTable(host, [
    { key: "name", label: "Name", clip: true, value: function (c) { return str(c.name); },
      html: function (c) { return '<a href="#convoy/' + c.id + '">' + esc(str(c.name, "Convoy " + c.id)) + "</a>"; } },
    { key: "owner", label: "Owner", value: function (c) { return playerName(c.owner_id); },
      html: function (c) { return esc(playerName(c.owner_id)); } },
    { key: "line", label: "Line", clip: true,
      value: function (c) { return (IDX.line[c.line_id] ? str(IDX.line[c.line_id].name) : ""); },
      html: function (c) {
        return (c.line_id === null || c.line_id === undefined)
          ? '<span class="faint">no line</span>' : lineLink(c.line_id);
      } },
    { key: "state", label: "State", value: function (c) { return str(c.state); },
      html: function (c) { return stateBadge(c.state); } },
    { key: "veh", label: "Vehicles", num: true,
      value: function (c) { return num(c.vehicle_count, arr(c.vehicles).length); },
      html: function (c) { return fmtInt(num(c.vehicle_count, arr(c.vehicles).length)); } },
    { key: "load", label: "Loading", num: true, value: function (c) { return num(c.loading_level); },
      html: function (c) { return loadBar(c.loading_level); } },
    { key: "cap", label: "Loaded / capacity", num: true, value: function (c) { return num(c.total_loaded); },
      html: function (c) { return fmtInt(c.total_loaded) + " / " + fmtInt(c.total_capacity); } },
    { key: "speed", label: "Max speed", num: true, value: function (c) { return num(c.max_speed); },
      html: function (c) { return fmtInt(c.max_speed); } },
    { key: "profit", label: "Profit this month", num: true, value: function (c) { return num(c.profit_this_month); },
      html: function (c) { return signed(c.profit_this_month, true); } },
    { key: "notes", label: "Notes", value: convoyNotesValue, html: convoyNotes }
  ], rows, { state: f.state, rerender: rerender, href: function (c) { return "#convoy/" + c.id; },
             emptyText: "No convoys match this filter." });
}

function viewConvoyDetail(host, id) {
  var c = IDX.convoy[id];
  if (!c) { html(host, '<div class="empty">No convoy with id ' + esc(id) + " in this export.</div>"); return; }
  html(host, '<a class="backlink" href="#convoys">Back to convoys</a>');
  html(host, '<div class="detail-head"><h1>' + esc(str(c.name, "Convoy " + c.id)) + "</h1>" +
             stateBadge(c.state) + "</div>");
  var lineTxt = (c.line_id === null || c.line_id === undefined)
    ? '<span class="faint">runs without a line</span>' : lineLink(c.line_id);
  html(host, '<div class="card"><dl class="kv">' +
    "<dt>Convoy id</dt><dd>" + esc(String(c.id)) + "</dd>" +
    "<dt>Owner</dt><dd>" + esc(playerName(c.owner_id)) + "</dd>" +
    "<dt>Line</dt><dd>" + lineTxt + "</dd>" +
    "<dt>Position</dt><dd>" + fmtPos(c.pos) + "</dd>" +
    "<dt>Home depot</dt><dd>" + fmtPos(c.home_depot) + "</dd>" +
    "<dt>Vehicles</dt><dd>" + fmtInt(num(c.vehicle_count, arr(c.vehicles).length)) + "</dd>" +
    "<dt>" + (c.coupling ? "Pair's max speed" : "Max speed") + "</dt><dd>" + fmtInt(c.max_speed) + " km/h" +
      (num(c.sum_power) ? ", " + fmtInt(c.sum_power) + " kW" : "") + "</dd>" +
    (c.traction ? "<dt>Traction</dt><dd>" + esc(TRACTION_TEXT[c.traction] || c.traction) + "</dd>" : "") +
    (waitText(c, true) ? "<dt>" + (c.waiting_for ? "Waiting" : "Departure") + "</dt><dd>" +
      waitText(c, true).replace(/^Departure: /, "") + "</dd>" : "") +
    (c.running_late ? '<dt>Running late</dt><dd>missed its coupling</dd>' : "") +
    (c.hold_marker ? "<dt>Hold marker</dt><dd>lets passing trains overtake</dd>" : "") +
    (c.hold_divert ? "<dt>Diverted</dt><dd>heading for a platform to let a passing train by</dd>" : "") +
    (c.claim_boundary ? "<dt>Claimed track</dt><dd>at the next station, boundary " +
      '<span class="mono">(' + esc(c.claim_boundary) + ")</span></dd>" : "") +
    "<dt>Loading</dt><dd>" + loadBar(c.loading_level) +
      (num(c.loading_limit) > 0 ? ' <span class="dim">(waits for ' + num(c.loading_limit) + "%)</span>" : "") + "</dd>" +
    "<dt>Loaded</dt><dd>" + fmtInt(c.total_loaded) + " of " + fmtInt(c.total_capacity) +
      (c.crowd ? ' <span class="dim">(' + esc(crowdText(c.crowd)) + ")</span>" : "") + "</dd>" +
    "<dt>Revenue this month</dt><dd>" + fmtMoney(c.revenue_this_month) + "</dd>" +
    "<dt>Profit this month</dt><dd>" + signed(c.profit_this_month, true) + "</dd>" +
    "<dt>Profit last year</dt><dd>" + signed(c.profit_last_year, true) + "</dd>" +
    "</dl></div>");

  /* coupled pair: the other train, where they part and its load, like the convoy window */
  var partner = c.coupling ? IDX.convoy[c.coupled_with] : null;
  if (c.coupling) {
    var ph = '<div class="card pair" style="margin-top:10px"><dl class="kv">' +
      "<dt>" + (c.coupling === "primary" ? "Coupled with" : "Coupled to") + "</dt><dd>" + convoyLink(c.coupled_with) +
        ' <span class="dim">(' + (c.coupling === "primary" ? "behind this train" : "in front, it drives the pair") + ")</span></dd>";
    if (partner) {
      ph += "<dt>Its line</dt><dd>" + (IDX.line[partner.line_id] ? lineLink(partner.line_id) : '<span class="faint">none</span>') + "</dd>" +
        "<dt>Its load</dt><dd>" + (partner.crowd ? esc(crowdText(partner.crowd)) : loadBar(partner.loading_level)) + "</dd>";
    }
    ph += "<dt>Uncouples at</dt><dd>" + (c.uncouples_at !== null && c.uncouples_at !== undefined
      ? stopLink(c.uncouples_at) : '<span class="dim">stays coupled</span>') + "</dd></dl></div>";
    html(host, ph);
  }

  /* the whole train front first, like the vehicle details: primary's vehicles, then the joined train's */
  var front = c.coupling === "joined" && partner ? partner : c;
  var back = c.coupling === "primary" ? partner : (c.coupling === "joined" ? c : null);
  var vrows = [];
  arr(front.vehicles).forEach(function (v) { vrows.push({ v: v, cnv: front }); });
  if (back && back !== front) arr(back.vehicles).forEach(function (v) { vrows.push({ v: v, cnv: back }); });
  var anyCrowd = vrows.some(function (r) { return r.v.seated !== undefined; });
  var vcols = [];
  if (back) {
    vcols.push({ key: "part", label: "Train", html: function (r) {
      return r.cnv === c ? '<span class="dim">this train</span>' : convoyLink(r.cnv.id);
    } });
  }
  vcols.push(
    { key: "name", label: "Name", value: function (r) { return str(r.v.name); },
      html: function (r) { return esc(str(r.v.name, "unnamed")); } },
    { key: "catg", label: "Carries", html: function (r) { return esc(catgName(num(r.v.goods_catg))); } },
    { key: "cap", label: anyCrowd ? "Capacity (seats)" : "Capacity", num: true, html: function (r) { return fmtInt(r.v.capacity); } },
    { key: "loaded", label: "Loaded", num: true, html: function (r) { return fmtInt(r.v.loaded); } });
  if (anyCrowd) {
    vcols.push(
      { key: "standing", label: "Standing", num: true, html: function (r) {
        return r.v.seated === undefined ? '<span class="faint">-</span>' : fmtInt(r.v.standing) + '<span class="faint">/' + fmtInt(r.v.standing_max) + "</span>";
      } },
      { key: "over", label: "Overcrowded", num: true, html: function (r) {
        return r.v.seated === undefined ? '<span class="faint">-</span>' : fmtInt(r.v.overcrowded) + '<span class="faint">/' + fmtInt(r.v.overcrowded_max) + "</span>";
      } });
  }
  vcols.push(
    { key: "speed", label: "Max speed", num: true, html: function (r) { return fmtInt(r.v.max_speed); } },
    { key: "power", label: "Power", num: true, html: function (r) {
      if (!num(r.v.power)) return '<span class="faint">0</span>';
      return fmtInt(r.v.power) + (r.v.idle ? ' <span class="dim">(idle)</span>' : "");
    } });
  heading(host, back ? "Vehicles of the coupled train, front first" : "Vehicles");
  renderTable(host, vcols, vrows, { short: true, onSort: false, emptyText: "No vehicle list in this export." });

  heading(host, "Schedule");
  if (c.schedule) {
    scheduleList(host, c.schedule);
  } else if (IDX.line[c.line_id]) {
    html(host, '<div class="empty">This convoy follows the schedule of ' + lineLink(c.line_id) + ".</div>");
  } else {
    html(host, '<div class="empty">This convoy has no schedule in the export.</div>');
  }
}

/* -------------------------------------------------------------------- map */

var mapState = null;

function typeColor(t) {
  var v = getComputedStyle(document.documentElement)
            .getPropertyValue("--t-" + (TYPES.indexOf(t) >= 0 ? t : "other"));
  return (v || "#888").trim();
}

function viewMap(host) {
  host.classList.add("nopad");
  var f = filters.map || (filters.map = { types: null, showStops: true, showCities: true });
  var used = {};
  arr(D.lines).forEach(function (l) { used[str(l.type, "other")] = 1; });
  var typeList = LINE_TYPES.filter(function (t) { return used[t]; });
  if (!f.types) {
    f.types = {};
    typeList.forEach(function (t) { f.types[t] = true; });
  }

  var root = document.createElement("div");
  root.className = "maproot";
  var bar = document.createElement("div");
  bar.className = "mapbar";
  var barHTML = "<span class='dim'>Lines:</span>";
  typeList.forEach(function (t) {
    barHTML += '<label><input type="checkbox" data-type="' + t + '"' + (f.types[t] ? " checked" : "") + ">" +
               '<span class="swatch" style="background:var(--t-' + t + ')"></span>' + esc(titleOf(t)) + "</label>";
  });
  barHTML += '<label><input type="checkbox" data-flag="showStops"' + (f.showStops ? " checked" : "") + ">Stops</label>";
  barHTML += '<label><input type="checkbox" data-flag="showCities"' + (f.showCities ? " checked" : "") + ">Cities</label>";
  barHTML += '<button class="btn" id="map-zoomin" title="Zoom in">+</button>';
  barHTML += '<button class="btn" id="map-zoomout" title="Zoom out">-</button>';
  barHTML += '<button class="btn" id="map-reset">Reset view</button>';
  barHTML += '<span class="hint">Drag to pan, wheel to zoom, click a stop or a line to open it.</span>';
  bar.innerHTML = barHTML;
  root.appendChild(bar);

  var holder = document.createElement("div");
  holder.className = "mapholder";
  var canvas = document.createElement("canvas");
  canvas.id = "mapcanvas";
  holder.appendChild(canvas);
  var tip = document.createElement("div");
  tip.className = "maptip";
  tip.style.display = "none";
  holder.appendChild(tip);
  root.appendChild(holder);
  host.appendChild(root);

  bar.addEventListener("change", function (ev) {
    var t = ev.target.getAttribute("data-type");
    if (t) { f.types[t] = ev.target.checked; draw(); return; }
    var fl = ev.target.getAttribute("data-flag");
    if (fl) { f[fl] = ev.target.checked; draw(); }
  });
  bar.querySelector("#map-reset").addEventListener("click", function () { fit(); draw(); });
  bar.querySelector("#map-zoomin").addEventListener("click", function () { zoomBy(1.4); });
  bar.querySelector("#map-zoomout").addEventListener("click", function () { zoomBy(1 / 1.4); });

  var mp = obj(obj(D.meta).map);
  var mapW = num(mp.width, 0), mapH = num(mp.height, 0);
  if (!mapW || !mapH) {
    var maxx = 1, maxy = 1;
    arr(D.stops).forEach(function (s) {
      maxx = Math.max(maxx, num(obj(s.pos).x)); maxy = Math.max(maxy, num(obj(s.pos).y));
    });
    mapW = maxx + 8; mapH = maxy + 8;
  }

  /* screen = (world - o) * scale; kept in the filter state so leaving the map and
     coming back keeps the same position */
  var view = f.view || (f.view = { scale: 0, ox: 0, oy: 0 });
  var ctx = canvas.getContext("2d");
  var dpr = window.devicePixelRatio || 1;
  var cw = 0, ch = 0;

  /* precompute polylines once */
  var polys = [];
  arr(D.lines).forEach(function (l) {
    var pts = [];
    arr(obj(l.schedule).entries).forEach(function (e) {
      var p = obj(e).pos;
      if (p && typeof p.x === "number") pts.push([p.x, p.y]);
    });
    if (pts.length > 1) polys.push({ line: l, type: str(l.type, "other"), pts: pts });
  });
  var stopPts = arr(D.stops).filter(function (s) { return obj(s.pos) && typeof obj(s.pos).x === "number"; });
  var cityPts = arr(D.cities).filter(function (c) { return obj(c.pos) && typeof obj(c.pos).x === "number"; });

  function resize() {
    cw = holder.clientWidth; ch = holder.clientHeight;
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(cw * dpr));
    canvas.height = Math.max(1, Math.round(ch * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function fit() {
    resize();
    var s = Math.min(cw / mapW, ch / mapH) * 0.94;
    view.scale = s || 1;
    view.ox = mapW / 2 - cw / (2 * view.scale);
    view.oy = mapH / 2 - ch / (2 * view.scale);
  }
  function sx(x) { return (x - view.ox) * view.scale; }
  function sy(y) { return (y - view.oy) * view.scale; }
  function wx(px) { return px / view.scale + view.ox; }
  function wy(py) { return py / view.scale + view.oy; }

  function zoomAt(px, py, k) {
    var bx = wx(px), by = wy(py);
    view.scale = Math.max(0.05, Math.min(60, view.scale * k));
    view.ox = bx - px / view.scale;
    view.oy = by - py / view.scale;
    draw();
  }
  function zoomBy(k) { zoomAt(cw / 2, ch / 2, k); }

  var raf = null;
  function draw() {
    if (raf) return;
    raf = requestAnimationFrame(function () { raf = null; paint(); });
  }
  function paint() {
    var cs = getComputedStyle(document.documentElement);
    var panel = (cs.getPropertyValue("--panel") || "#fff").trim();
    var border = (cs.getPropertyValue("--border") || "#ddd").trim();
    var text = (cs.getPropertyValue("--text") || "#000").trim();
    var bg = (cs.getPropertyValue("--bg") || "#eee").trim();
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, cw, ch);
    /* map extent */
    ctx.fillStyle = panel;
    ctx.fillRect(sx(0), sy(0), mapW * view.scale, mapH * view.scale);
    ctx.strokeStyle = border;
    ctx.lineWidth = 1;
    ctx.strokeRect(sx(0), sy(0), mapW * view.scale, mapH * view.scale);

    /* lines */
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    polys.forEach(function (p) {
      if (!f.types[p.type]) return;
      ctx.strokeStyle = typeColor(p.type);
      ctx.lineWidth = Math.max(1, Math.min(3, view.scale * 0.9));
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.moveTo(sx(p.pts[0][0]), sy(p.pts[0][1]));
      for (var i = 1; i < p.pts.length; i++) ctx.lineTo(sx(p.pts[i][0]), sy(p.pts[i][1]));
      ctx.stroke();
    });
    ctx.globalAlpha = 1;

    /* stops */
    if (f.showStops) {
      var side = Math.max(3, Math.min(9, view.scale * 2.2));
      stopPts.forEach(function (s) {
        var x = sx(obj(s.pos).x), y = sy(obj(s.pos).y);
        if (x < -20 || y < -20 || x > cw + 20 || y > ch + 20) return;
        ctx.fillStyle = panel;
        ctx.fillRect(x - side / 2, y - side / 2, side, side);
        ctx.strokeStyle = text;
        ctx.lineWidth = 1;
        ctx.strokeRect(x - side / 2, y - side / 2, side, side);
      });
    }

    /* cities */
    if (f.showCities) {
      ctx.font = "12px -apple-system, Segoe UI, sans-serif";
      ctx.textAlign = "center";
      cityPts.forEach(function (c) {
        var x = sx(obj(c.pos).x), y = sy(obj(c.pos).y);
        if (x < -60 || y < -30 || x > cw + 60 || y > ch + 30) return;
        ctx.fillStyle = text;
        ctx.beginPath();
        ctx.arc(x, y, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = panel;
        ctx.globalAlpha = 0.75;
        var w = ctx.measureText(str(c.name)).width;
        ctx.fillRect(x - w / 2 - 3, y - 19, w + 6, 14);
        ctx.globalAlpha = 1;
        ctx.fillStyle = text;
        ctx.fillText(str(c.name, "city"), x, y - 8);
      });
      ctx.textAlign = "left";
    }
    ctx.restore();
  }

  function hitStop(px, py) {
    var best = null, bd = 8;
    for (var i = 0; i < stopPts.length; i++) {
      var s = stopPts[i];
      var d = Math.max(Math.abs(sx(obj(s.pos).x) - px), Math.abs(sy(obj(s.pos).y) - py));
      if (d < bd) { bd = d; best = s; }
    }
    return best;
  }
  function segDist(px, py, ax, ay, bx, by) {
    var dx = bx - ax, dy = by - ay;
    var len = dx * dx + dy * dy;
    var t = len ? ((px - ax) * dx + (py - ay) * dy) / len : 0;
    t = Math.max(0, Math.min(1, t));
    var qx = ax + t * dx, qy = ay + t * dy;
    return Math.sqrt((px - qx) * (px - qx) + (py - qy) * (py - qy));
  }
  function hitLine(px, py) {
    var best = null, bd = 5;
    for (var i = 0; i < polys.length; i++) {
      var p = polys[i];
      if (!f.types[p.type]) continue;
      for (var j = 1; j < p.pts.length; j++) {
        var d = segDist(px, py, sx(p.pts[j - 1][0]), sy(p.pts[j - 1][1]), sx(p.pts[j][0]), sy(p.pts[j][1]));
        if (d < bd) { bd = d; best = p.line; }
      }
    }
    return best;
  }

  var dragging = false, moved = false, lastX = 0, lastY = 0;
  canvas.addEventListener("mousedown", function (ev) {
    dragging = true; moved = false; lastX = ev.clientX; lastY = ev.clientY;
    canvas.classList.add("drag");
  });
  window.addEventListener("mouseup", function () { dragging = false; canvas.classList.remove("drag"); });
  canvas.addEventListener("mousemove", function (ev) {
    var r = canvas.getBoundingClientRect();
    var px = ev.clientX - r.left, py = ev.clientY - r.top;
    if (dragging) {
      var dx = ev.clientX - lastX, dy = ev.clientY - lastY;
      if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      view.ox -= dx / view.scale; view.oy -= dy / view.scale;
      lastX = ev.clientX; lastY = ev.clientY;
      tip.style.display = "none";
      draw();
      return;
    }
    var s = f.showStops ? hitStop(px, py) : null;
    var label = null;
    if (s) label = str(s.name, "Stop " + s.id);
    else {
      var l = hitLine(px, py);
      if (l) label = str(l.name, "Line " + l.id);
    }
    if (label) {
      tip.textContent = label;
      tip.style.display = "block";
      tip.style.left = Math.min(cw - tip.offsetWidth - 4, px + 12) + "px";
      tip.style.top = Math.max(2, py - 26) + "px";
      canvas.style.cursor = "pointer";
    } else {
      tip.style.display = "none";
      canvas.style.cursor = "grab";
    }
  });
  canvas.addEventListener("mouseleave", function () { tip.style.display = "none"; });
  canvas.addEventListener("click", function (ev) {
    if (moved) return;
    var r = canvas.getBoundingClientRect();
    var px = ev.clientX - r.left, py = ev.clientY - r.top;
    var s = f.showStops ? hitStop(px, py) : null;
    if (s) { location.hash = "#stop/" + s.id; return; }
    var l = hitLine(px, py);
    if (l) location.hash = "#line/" + l.id;
  });
  canvas.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    var r = canvas.getBoundingClientRect();
    var px = ev.clientX - r.left, py = ev.clientY - r.top;
    zoomAt(px, py, Math.pow(1.0015, -ev.deltaY));
  }, { passive: false });

  mapState = { resize: function () { resize(); draw(); } };
  if (view.scale > 0) resize(); else fit();
  draw();
  setTimeout(function () { resize(); draw(); }, 0);
}

window.addEventListener("resize", function () { if (mapState && route.view === "map") mapState.resize(); });
if (window.matchMedia) {
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", function () {
    if (mapState && route.view === "map") mapState.resize();
  });
}

/* ----------------------------------------------------------------- router */

var VIEWS = {
  overview: viewOverview,
  settings: viewSettings,
  lines: viewLines,
  stops: viewStops,
  convoys: viewConvoys,
  cities: viewCities,
  factories: viewFactories,
  goods: viewGoods,
  map: viewMap
};
var DETAILS = { line: viewLineDetail, stop: viewStopDetail, convoy: viewConvoyDetail };
var NAV_OF = { line: "lines", stop: "stops", convoy: "convoys" };

function parseHash() {
  var h = location.hash.replace(/^#/, "");
  if (!h) return { view: "overview", id: null };
  var parts = h.split("/");
  if (parts.length > 1 && DETAILS[parts[0]]) return { view: parts[0], id: parts[1] };
  if (VIEWS[parts[0]]) return { view: parts[0], id: null };
  return { view: "overview", id: null };
}

function rerender() { render(); }

function render() {
  var main = document.getElementById("main");
  main.classList.remove("nopad");
  main.innerHTML = "";
  mapState = null;
  if (DETAILS[route.view]) {
    markNav(NAV_OF[route.view]);
    DETAILS[route.view](main, route.id);
  } else {
    markNav(route.view);
    (VIEWS[route.view] || viewOverview)(main);
  }
  restoreFocus();
}

function onHash() {
  if (!D) return;
  var prev = route;
  route = parseHash();
  if (!DETAILS[route.view]) {
    try { localStorage.setItem("simutrans-saveviewer-tab", route.view); } catch (e) {}
  }
  render();
  if (prev.view !== route.view || prev.id !== route.id) {
    document.getElementById("main").scrollTop = 0;
  }
}
window.addEventListener("hashchange", onHash);

/* --------------------------------------------------------- file plumbing */

var fileInput = document.getElementById("fileinput");
document.getElementById("btn-pick").addEventListener("click", function () { fileInput.click(); });
document.getElementById("btn-open").addEventListener("click", function () { fileInput.click(); });
fileInput.addEventListener("change", function () {
  if (fileInput.files && fileInput.files[0]) handleFile(fileInput.files[0]);
  fileInput.value = "";
});

var dropZone = document.getElementById("drop");
["dragenter", "dragover"].forEach(function (e) {
  dropZone.addEventListener(e, function (ev) { ev.preventDefault(); dropZone.classList.add("over"); });
});
["dragleave", "drop"].forEach(function (e) {
  dropZone.addEventListener(e, function () { dropZone.classList.remove("over"); });
});

var mask = null;
window.addEventListener("dragover", function (ev) {
  ev.preventDefault();
  if (!mask) {
    mask = document.createElement("div");
    mask.className = "dropmask";
    mask.textContent = "Drop the export JSON to load it";
    document.body.appendChild(mask);
  }
});
window.addEventListener("dragleave", function (ev) {
  if (ev.clientX === 0 && ev.clientY === 0 && mask) { mask.remove(); mask = null; }
});
window.addEventListener("drop", function (ev) {
  ev.preventDefault();
  if (mask) { mask.remove(); mask = null; }
  var dt = ev.dataTransfer;
  if (dt && dt.files && dt.files[0]) handleFile(dt.files[0]);
});

/* optional ?file=name.json, works when the folder is served over http */
(function () {
  var m = /[?&]file=([^&]+)/.exec(location.search);
  if (!m) return;
  var name = decodeURIComponent(m[1]);
  fetch(name).then(function (r) {
    if (!r.ok) throw new Error("http " + r.status);
    return r.text();
  }).then(function (t) {
    try { loadJSON(t, name); } catch (e) { showLoadError(e.message); }
  }).catch(function () { /* no such file, keep the file picker */ });
})();
</script>
